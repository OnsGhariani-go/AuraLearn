<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Aura Learn | Connexion Étudiant</title>
    <link rel="stylesheet" href="loginetudiant.css">
</head>
<body>

<div class="main-container">
    <div class="brand-section">
        <div class="logo-box" ><img src="AuraLearn.png"></div>
        <h1>Aura Learn</h1>
        <p class="tagline">Analyse • Anticipe • Apprends</p>
    </div>

    <div class="form-section">
        <form action="page1.html" method="POST" class="login-form">
            <h1>Bienvenue sur Aura Learn</h1>
            <p class="subtitle"><h4>Veuillez vous connecter pour accéder à votre espace.</h4></p>

            <div class="input-group">
                <input type="text" name="cin" required placeholder=" ">
                <label> CIN </label>
            </div>

            <div class="input-group">
                <input type="password" name="password" required placeholder=" ">
                <label> Mot de passe</label>
            </div>

            <div class="form-options">
            </div>

            <button type="submit" class="btn-login">Se connecter</button>
        </form>
    </div>
</div>

</body>
</html>
